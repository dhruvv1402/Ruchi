# Keeps the live demo awake.
#
# Render's free tier puts a service to sleep after fifteen minutes without a request, and the first
# visitor after that waits 30-60 seconds while it boots: long enough for someone opening the link from
# a resume to close the tab. A request every five minutes keeps it up. GitHub runs schedules late
# under load, which is why the interval is well inside fifteen minutes rather than just under it.
#
# Render's 750 free instance hours a month cover one service running all month. GitHub disables a
# schedule in a public repository after 60 days with no activity; re-enable it from the Actions tab.

name: Keep alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

env:
  HEALTH_URL: https://law-ruchi.vercel.app/api/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health route
        # A cold instance can take a minute to answer, so the retries wait it out rather than fail.
        run: |
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$HEALTH_URL"
          echo
